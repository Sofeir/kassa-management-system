# Публикация системы управления кассами на GitHub Pages.
# Сборки нет: в сайт копируются только файлы интерфейса (без serve.js, package.json, README).
# Загрузка и публикация в двух задачах, как в официальном шаблоне: артефакт появляется для deploy только после конца первой задачи.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать папку сайта
        run: |
          mkdir _site
          cp -r index.html css js img docs _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
